<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Website Title</title>
</head>
<body>
    <nav>
        <a href="/" class = "logo">Šeit būs logo</a> <!-- class ir reusable un id nav -->
        <ul id="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/missions">Missions</a></li>
            <li class="hiddenLink" style="display:none"><a href="/mymissions">My Missions</a></li>
            <li class="hiddenLink" style="display:none"><a href="/joingame">Join Game</a></li>
            <li class="hiddenLink" style="display:none"><a href="/mycharacters">Characters</a></li> <!-- characters un friends tabi paradas tikai kad lietotajs pierakstas -->
            <li class="hiddenLink" style="display:none"><a href="/friends">Friends</a></li>
            <li><a href="/about">About</a></li>
        </ul>

        <div id="auth-buttons">
            <button id="logInButton"><a href="/login">Sign in</a></button>
            <button id="logOutButton" style="display:none">Sign out</button>
        </div>
    </nav>

    <div id="tutorialDiv"> <!-- tutorial -->
        <p>There will be a tutorial here</p>
    </div>

    <div id="textDiv"> <!-- How did I get here? type of beat -->
        <p>There will be text here</p>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    if (sessionStorage.getItem('userId')) {
        document.querySelectorAll('.hiddenLink').forEach(el => {
            el.style.display = 'revert';
        });
        document.querySelector('#logInButton')?.style.setProperty('display', 'none');
        document.querySelector('#logOutButton')?.style.setProperty('display', 'revert');
    }

    document.querySelector('#logOutButton').addEventListener('click', () => {
      sessionStorage.removeItem('userId');
      window.location.href = '/';
    });
</script>
</body>
</html>
